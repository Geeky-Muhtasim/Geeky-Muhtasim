name: Arena

# Redraws the live cards in the profile README: the contribution snake and the
# arena stats card. They are published to the `output` branch, which the README
# reads; main only ever holds the hand-made cards and the scripts.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 09:17 in Dhaka
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: arena
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fe0a0&color_dots=#161b22,#1e3b36,#2e5a4e,#4f7f64,#e9b872
            dist/snake-light.svg?color_snake=#2e5a4e&color_dots=#ebedf0,#c6e3cf,#8cc7a0,#4f7f64,#c9875a

      - name: Arena card
        run: python3 scripts/arena.py dist/arena.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Redraw the arena"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
